name: Build Artalk avatar image

on:
  workflow_dispatch:
  push:
    branches: [main, codex/artalk-comment-avatar]
    paths:
      - patches/artalk/**
      - scripts/comments/**
      - src/utils/comment-avatar.ts
      - src/config/comment.ts
      - src/components/blog/ArtalkComments.astro
      - src/components/sidebar/RecentComments.svelte
      - src/styles/artalk.css
      - .github/workflows/artalk-avatar.yml

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:comment-avatar
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          file: scripts/comments/avatar.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mcxiaochenn/dusklight-artalk:v2.10.0-avatar.1-${{ github.sha }}
      - name: 记录不可变镜像地址
        run: echo 'ghcr.io/mcxiaochenn/dusklight-artalk@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
