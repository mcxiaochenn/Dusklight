name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 接收内容仓库的触发
  repository_dispatch:
    types: [content-updated]
  # 手动触发
  workflow_dispatch:

# GitHub Pages 部署权限
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # /timeline/ 页构建期读完整 git log
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 同步内容仓库（私有仓库：CONTENT_REPO_URL secret 需内嵌 PAT，
      # 形如 https://<PAT>@github.com/mcxiaochenn/Dusklight-Content.git）
      - name: Sync content repository
        run: pnpm sync-content
        env:
          ENABLE_CONTENT_SYNC: "true"
          CONTENT_REPO_URL: ${{ secrets.CONTENT_REPO_URL }}
          CONTENT_BRANCH: main

      # 安装 Playwright（Mermaid 图表渲染需要）
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # 构建 Astro 站点（build 链前置追番数据拉取，BILI_SESSDATA 可选）
      - name: Build Astro site
        run: pnpm build
        env:
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}

      # 上传构建产物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
