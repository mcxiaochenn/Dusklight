name: Deploy to gh-pages

on:
  push:
    branches: [main]
  # 接收内容仓库的触发
  repository_dispatch:
    types: [content-updated]
  # 手动触发
  workflow_dispatch:

# 推送 gh-pages 分支需要 contents: write（仅限 GITHUB_TOKEN 作用范围）
permissions:
  contents: write

# 只允许一个并发部署
concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # /timeline/ 页构建期读完整 git log
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 同步内容仓库（私有仓库：CONTENT_REPO_URL secret 需内嵌 PAT，
      # 形如 https://<PAT>@github.com/mcxiaochenn/Dusklight-Content.git）
      - name: Sync content repository
        run: pnpm sync-content
        env:
          ENABLE_CONTENT_SYNC: "true"
          CONTENT_REPO_URL: ${{ secrets.CONTENT_REPO_URL }}
          CONTENT_BRANCH: main

      # 构建 Astro 站点（build 链前置追番数据拉取，BILI_SESSDATA 可选）
      - name: Build Astro site
        run: pnpm build
        env:
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}

      # 上传构建产物
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: ./dist

  # 推送到 gh-pages 分支 —— EdgeOne Pages 从该分支自动部署到 blog.mcxiaochen.top
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: ./dist

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
