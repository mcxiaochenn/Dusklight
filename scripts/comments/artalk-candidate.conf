# 候选入口仅允许读取；正式切换验收后才移除 limit_except。
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name artalk.mcxiaochen.top;
    ssl_certificate /www/sites/twikoo.mcxiaochen.top/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/twikoo.mcxiaochen.top/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 5m;
    access_log /var/log/nginx/artalk-access.log main;
    error_log /var/log/nginx/artalk-error.log;
    if ($scheme = http) { return 301 https://$host$request_uri; }
    location / {
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:23366;
        proxy_set_header Host $host;
        # 沿用现有反代边界；不直接信任客户端可伪造的 X-Forwarded-For。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Server;
        add_header Cache-Control "no-store" always;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
